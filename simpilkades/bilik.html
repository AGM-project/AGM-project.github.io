<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilik Suara Pilkades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Library Scanner QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Library Popup Konfirmasi (SweetAlert2) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-dark">
  <div class="container py-4">
    <a href="index.html" class="btn btn-sm btn-secondary py-3 mb-4">KEMBALI</a>
    <!-- BAGIAN 1: SCANNER KAMERA -->
    <div id="scanner-section" class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h5>Silakan Scan QR Code Anda di Sini</h5>
      </div>
      <div class="card-body text-center">
        <div id="reader" style="width: 100%; max-width: 400px; margin: auto;"></div>
        <p class="mt-3 text-muted">Arahkan QR Code ke kamera depan.</p>
      </div>
    </div>

    <!-- BAGIAN 2: KANDIDAT PEMILIHAN (Awalnya Disembunyikan) -->
    <div id="voting-section" class="d-none">
      <div class="alert alert-info text-center">
        <h4 class="mb-0">Selamat Datang, <strong id="voterName"></strong></h4>
        <p class="mb-0 small">NIK: <span id="voterNik"></span></p>
      </div>
      
      <h4 class="text-white text-center mb-4">Pilih Calon Kepala Desa</h4>
      
      <div class="row row-cols-2 row-cols-md-5 g-3" id="kandidat-container">
        <!-- Data 5 Kandidat -->
        <script>
          const kandidat = [
            { id: 1, nama: "Budi Santoso", foto: "https://via.placeholder.com/150/FF0000/FFFFFF?text=No.1" },
            { id: 2, nama: "Siti Aminah", foto: "https://via.placeholder.com/150/0000FF/FFFFFF?text=No.2" },
            { id: 3, nama: "Joko Anwar", foto: "https://via.placeholder.com/150/008000/FFFFFF?text=No.3" },
            { id: 4, nama: "Ahmad Dani", foto: "https://via.placeholder.com/150/FFA500/FFFFFF?text=No.4" },
            { id: 5, nama: "Rina Nose", foto: "https://via.placeholder.com/150/800080/FFFFFF?text=No.5" }
          ];

          document.write(kandidat.map(k => `
            <div class="col">
              <div class="card h-100 text-center shadow-sm">
                <img src="${k.foto}" class="card-img-top" alt="Foto ${k.nama}">
                <div class="card-body p-2">
                  <h6 class="card-title">${k.nama}</h6>
                </div>
                <div class="card-footer p-2 bg-white border-0">
                  <button class="btn btn-danger w-100 fw-bold" onclick="pilihKandidat('${k.id}', '${k.nama}', '${k.foto}')">PILIH</button>
                </div>
              </div>
            </div>
          `).join(''));
        </script>
      </div>
    </div>

  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbywW2gdAHbxLtlZw7m8uHOnRwFSMdpL007Wen23lWs/dev';
    let currentNik = "";
    let html5QrCode;

    // Inisialisasi Kamera Depan
    function startScanner() {
      document.getElementById('scanner-section').classList.remove('d-none');
      document.getElementById('voting-section').classList.add('d-none');
      
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "user" }, // Memaksa menggunakan kamera depan
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      );
    }

    function stopScanner() {
      if(html5QrCode) html5QrCode.stop().catch(err => console.log(err));
    }

    // Fungsi saat QR Code berhasil terbaca
    function onScanSuccess(decodedText) {
      stopScanner(); // Matikan kamera sementara waktu cek database
      
      // Memecah "NIK|Nama" dari QR Code
      let qrData = decodedText.split("|");
      let scanNik = qrData[0];

      Swal.fire({ title: 'Memverifikasi Data...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      // Kirim request verify ke Google Sheets
      let formData = new FormData();
      formData.append('action', 'verify');
      formData.append('nik', scanNik);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          Swal.close();
          
          if (data.status === "already_voted") {
            // JIKA SUDAH MEMILIH
            Swal.fire({
              icon: 'error',
              title: 'Akses Ditolak!',
              html: `Pemilih atas nama <b>${data.nama}</b> (NIK: ${data.nik}) <br><br> <strong class="text-danger">SUDAH MELAKUKAN PEMILIHAN</strong>`,
              confirmButtonText: 'Kembali ke Kamera'
            }).then(() => startScanner());
          } 
          else if (data.status === "ready") {
            // JIKA BELUM MEMILIH -> MASUK HALAMAN KANDIDAT
            currentNik = scanNik;
            document.getElementById('voterName').innerText = data.nama;
            document.getElementById('voterNik').innerText = data.nik;
            
            document.getElementById('scanner-section').classList.add('d-none');
            document.getElementById('voting-section').classList.remove('d-none');
          } 
          else {
            // JIKA NIK TIDAK ADA DI DATABASE
            Swal.fire({
              icon: 'warning',
              title: 'Data Tidak Ditemukan',
              text: 'QR Code tidak terdaftar dalam DPT.',
              confirmButtonText: 'Coba Lagi'
            }).then(() => startScanner());
          }
        });
    }

    // Fungsi ketika tombol pilih ditekan
    function pilihKandidat(id, nama, foto) {
      Swal.fire({
        title: 'Konfirmasi Pilihan',
        html: `<p>Apakah Anda yakin ingin memilih:</p>
               <img src="${foto}" width="150" class="rounded mb-3 border">
               <h3 class="text-primary">${nama}</h3>`,
        showCancelButton: true,
        confirmButtonColor: '#28a745',
        cancelButtonColor: '#dc3545',
        confirmButtonText: 'Ya, Sah!',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) {
          kirimSuara(nama);
        }
      });
    }

    // Fungsi menyimpan ke Google Sheets
    function kirimSuara(pilihan) {
      Swal.fire({ title: 'Menyimpan Suara...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      let formData = new FormData();
      formData.append('action', 'vote');
      formData.append('nik', currentNik);
      formData.append('pilihan', pilihan);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          if(data.status === "success") {
            Swal.fire({
              icon: 'success',
              title: 'Terima Kasih!',
              text: 'Suara Anda berhasil disimpan.',
              timer: 3000,
              showConfirmButton: false
            }).then(() => {
              currentNik = "";
              startScanner(); // Kembali otomatis ke kamera
            });
          }
        });
    }

    // Jalankan kamera saat halaman pertama kali dibuka
    window.onload = startScanner;
  </script>
</body>
</html>
