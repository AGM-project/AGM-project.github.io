<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilik Suara - E-Pilkades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .hidden { display: none !important; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border: none; }
        .kandidat-card { cursor: pointer; border: 3px solid transparent; transition: 0.3s; display: flex; flex-direction: column;}
        .kandidat-card.selected { border-color: #198754; background-color: #e9f7ef; transform: scale(1.02); }
        .kandidat-img { height: auto; max-height: 250px; object-fit: cover; width: 100%; flex-grow: 1;}
        
        #kandidatList {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(1, 1fr);
        }
        @media (min-width: 576px) { #kandidatList { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 992px) { #kandidatList { grid-template-columns: repeat(4, 1fr); } }
        
        .confirm-img { max-width: 150px; height: auto; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Bilik Suara Pilkades</a>
        <!-- Tautan ini sengaja disembunyikan / diletakkan kecil agar pemilih tidak asal masuk ke admin -->
        <!-- <a class="text-white-50 text-decoration-none small" href="../simpilkades-admin/index.html">Admin</a> -->
    </div>
</nav>

<div class="container mt-4">
    <!-- BAGIAN SCANNER -->
    <div id="scanSection" class="text-center card shadow-sm p-4">
        <h3 class="mb-3">Selamat Datang di Bilik Suara</h3>
        <p class="text-muted">Arahkan QR Code Anda ke kamera untuk mulai memilih.</p>
        <div id="reader"></div>
    </div>
    
    <!-- BAGIAN VOTING (Disembunyikan awalnya) -->
    <div id="voteSection" class="hidden">
        <div class="alert alert-info text-center shadow-sm">
            <h4>Halo, <strong id="voterName"></strong></h4>
            <p class="mb-0">Silakan pilih kandidat. Jika Anda memilih <strong>lebih dari 1 (satu)</strong> kandidat, maka suara Anda dianggap <strong>TIDAK SAH</strong>.</p>
        </div>
        
        <div class="mt-4" id="kandidatList">
            <!-- Data kandidat akan masuk ke sini via javascript -->
        </div>
        
        <div class="text-center mt-4 mb-5">
            <button class="btn btn-success btn-lg px-5 shadow" onclick="konfirmasiVote()">Tentukan Pilihan</button>
        </div>
    </div>
</div>

<!-- MODAL KONFIRMASI -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Konfirmasi Pilihan</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p class="fs-5">Anda memilih:</p>
        <div id="confirmKandidat" class="fw-bold fs-4 text-success mb-3 d-flex flex-column align-items-center"></div>
        <p class="text-muted small">Suara tidak dapat diubah setelah disimpan.</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary px-4" onclick="submitVote()">Simpan Suara</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRKa8csKxTAUwGpmY6TqE5QhCnH6kvZtCSx9WDUnnO1W_YBSjOkKLbuWLuP1MJ3Xk6/exec'; 
    
    let currentScanner = null;
    let currentUser = null;
    let selectedKandidat = [];
    let allKandidat = [];
    let confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    async function req(data) {
        let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {'Content-Type': 'text/plain;charset=utf-8'}
        });
        return await res.json();
    }

    // Otomatis jalankan scanner saat halaman dibuka
    window.onload = function() {
        startScanner();
        fetchKandidat();
    };

    function startScanner() {
        if (currentScanner) {
            currentScanner.clear();
        }
        currentScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        currentScanner.render(async (decodedText) => {
            currentScanner.clear();
            document.getElementById('reader').innerHTML = "<h4 class='text-primary mt-4'>Memverifikasi NIK...</h4>";
            
            let res = await req({ action: 'getPemilihByNik', nik: decodedText });
            if(res.success) {
                if(res.data.status_memilih === 'Sudah Memilih') {
                    alert("Maaf, NIK ini SUDAH DIGUNAKAN untuk memilih.");
                    startScanner();
                } else {
                    currentUser = res.data;
                    document.getElementById('voterName').innerText = currentUser.nama;
                    document.getElementById('scanSection').classList.add('hidden');
                    document.getElementById('voteSection').classList.remove('hidden');
                }
            } else {
                alert("NIK tidak ditemukan dalam database!");
                startScanner();
            }
        });
    }

    async function fetchKandidat() {
        let res = await req({action: 'getKandidat'});
        if(res.success) {
            allKandidat = res.data;
            let html = '';
            // Ambil maksimal 4 kandidat
            allKandidat.slice(0, 4).forEach(k => {
                html += `
                <div>
                    <div class="card kandidat-card shadow-sm h-100" id="card_${k.id}" onclick="toggleKandidat('${k.id}')">
                        <img src="${k.foto}" class="card-img-top kandidat-img" alt="${k.nama}">
                        <div class="card-body text-center d-flex flex-column justify-content-end">
                            <h4 class="card-title fw-bold">${k.nama}</h4>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('kandidatList').innerHTML = html;
        }
    }

    function toggleKandidat(id) {
        let el = document.getElementById('card_' + id);
        if(selectedKandidat.includes(id)) {
            selectedKandidat = selectedKandidat.filter(i => i !== id);
            el.classList.remove('selected');
        } else {
            selectedKandidat.push(id);
            el.classList.add('selected');
        }
    }

    function konfirmasiVote() {
        if(selectedKandidat.length === 0) {
            alert("Anda tidak mencoblos satupun. Silakan pilih kandidat!");
            return;
        }
        
        let confirmHtml = "";
        selectedKandidat.forEach(id => {
            let k = allKandidat.find(x => String(x.id) === String(id));
            if(k) {
                confirmHtml += `
                <div class="mb-3 text-center">
                    <img src="${k.foto}" alt="${k.nama}" class="confirm-img shadow-sm d-block mx-auto">
                    <div>${k.nama}</div>
                </div>`;
            }
        });

        if(selectedKandidat.length > 1) {
            confirmHtml += "<hr><div class='text-danger bg-warning p-2 mt-2 rounded fs-6'>⚠️ Peringatan: Anda memilih lebih dari 1 kandidat. Suara Anda akan dianggap <b>TIDAK SAH (INVALID)</b>.</div>";
        }

        document.getElementById('confirmKandidat').innerHTML = confirmHtml;
        confirmModal.show();
    }

    async function submitVote() {
        confirmModal.hide();
        document.getElementById('voteSection').classList.add('hidden');
        document.getElementById('scanSection').classList.remove('hidden');
        document.getElementById('reader').innerHTML = "<h4 class='text-success mt-4'>Menyimpan suara...</h4>";
        
        let valid = selectedKandidat.length === 1; 
        let pilihan_id = selectedKandidat.join(", "); 

        let data = {
            action: 'vote',
            row: currentUser.row,
            pilihan_id: pilihan_id,
            valid: valid
        };

        let res = await req(data);
        if(res.success) {
            alert("Suara berhasil disimpan! Terima kasih.");
            selectedKandidat = []; 
            startScanner(); // Restart scanner
        }
    }
</script>
</body>
</html>
