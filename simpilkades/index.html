<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilik Suara - E-Pilkades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Mencegah scroll dan mengatur tinggi penuh */
        body, html { height: 100%; overflow: hidden; background-color: #f8f9fa; }
        .hidden { display: none !important; }
        
        /* Container utama agar pas 1 layar dikurangi tinggi Navbar */
        .fit-wrapper {
            height: calc(100vh - 60px); 
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
        }

        #reader { width: 100%; max-width: 350px; margin: 0 auto; border: none; }
        
        /* Layout Voting - Flexbox */
        #voteSection {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Teks Info lebih ringkas */
        .alert-compact { padding: 8px; margin-bottom: 10px; font-size: 0.9rem; }
        
        /* Grid Kandidat (2x2 di HP, 4x1 di Desktop) */
        #kandidatList {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, 1fr); /* Mobile 2 kolom */
            flex-grow: 1; /* Mengisi sisa ruang kosong di tengah */
            align-content: center;
        }
        @media (min-width: 768px) { 
            #kandidatList { grid-template-columns: repeat(4, 1fr); gap: 15px; } 
        }
        
        /* Card & Image lebih proporsional */
        .kandidat-card { cursor: pointer; border: 3px solid transparent; transition: 0.2s; display: flex; flex-direction: column; height: 100%; overflow: hidden;}
        .kandidat-card.selected { border-color: #198754; background-color: #e9f7ef; transform: scale(1.02); }
        .kandidat-img { 
            height: 22vh; /* Tinggi foto beradaptasi dengan layar */
            min-height: 120px;
            max-height: 200px;
            object-fit: cover; 
            width: 100%; 
        }
        .card-body-compact { padding: 8px; text-align: center; background: white;}
        .card-body-compact h6 { margin-bottom: 0; font-weight: bold; font-size: 0.95rem;}
        
        /* Modal Info & Gambar */
        .confirm-img { max-width: 90px; height: 90px; object-fit: cover; border-radius: 50%; margin-bottom: 5px; border: 2px solid #ddd;}
        .modal-body { padding: 15px; }
    </style>
</head>
<body>
<!-- <nav class="navbar navbar-dark bg-primary shadow-sm" style="height: 60px;">
    <div class="container-fluid px-3">
        <span class="navbar-brand fw-bold mb-0 h1 fs-5">Bilik Suara</span>
        <a class="text-white-50 text-decoration-none small" href="admin.html">Admin</a>
    </div>
</nav> -->

<div class="fit-wrapper">
    <!-- BAGIAN SCANNER -->
    <div id="scanSection" class="card shadow-sm p-3 m-auto w-100 text-center" style="max-width: 450px;">
        <h4 class="mb-2">Scan NIK Anda</h4>
        <p class="text-muted small mb-3">Arahkan QR Code ke kamera</p>
        <div id="reader"></div>
    </div>
    
    <!-- BAGIAN VOTING -->
    <div id="voteSection" class="hidden">
        <!-- Pesan Sambutan -->
        <div class="alert alert-info text-center shadow-sm alert-compact">
            <div class="fw-bold mb-1">Halo, <span id="voterName" class="text-uppercase"></span></div>
            <div style="font-size: 0.8rem; line-height: 1.2;">Pilih 1 kandidat. Jika lebih, suara <strong>TIDAK SAH</strong>.</div>
        </div>
        
        <!-- List Kandidat -->
        <div id="kandidatList">
            <!-- Data dari JS akan dirender di sini -->
        </div>
        
        <!-- Tombol Tentukan Pilihan -->
        <div class="mt-3 text-center">
            <button class="btn btn-success btn-lg w-100 shadow fw-bold py-2" onclick="konfirmasiVote()" style="max-width: 500px;">Tentukan Pilihan</button>
        </div>
    </div>
</div>

<!-- MODAL KONFIRMASI (Lebih Ringkas) -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white py-2">
        <h6 class="modal-title mb-0">Konfirmasi</h6>
        <button type="button" class="btn-close btn-close-white" style="font-size: 0.8rem;" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p class="small mb-2">Anda memilih:</p>
        <div id="confirmKandidat" class="fw-bold text-success mb-2 d-flex flex-column align-items-center"></div>
        <p class="text-muted" style="font-size: 0.75rem; margin-bottom: 0;">Suara tidak dapat diubah setelah disimpan.</p>
      </div>
      <div class="modal-footer justify-content-center py-1">
        <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm px-3" onclick="submitVote()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2JfCb7tsOJucFMUwa6evk2K2zD7p7boNLsdPNkclbQOa66ab1GeYMKBXhYC5s6hZJ/exec'; 
    
    let currentScanner = null;
    let currentUser = null;
    let selectedKandidat = [];
    let allKandidat = [];
    let confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    async function req(data) {
        let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {'Content-Type': 'text/plain;charset=utf-8'}
        });
        return await res.json();
    }

    window.onload = function() {
        startScanner();
        fetchKandidat();
    };

    function startScanner() {
        if (currentScanner) {
            currentScanner.clear();
        }
        currentScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        currentScanner.render(async (decodedText) => {
            currentScanner.clear();
            document.getElementById('reader').innerHTML = "<h5 class='text-primary mt-3'>Memverifikasi...</h5>";
            
            let res = await req({ action: 'getPemilihByNik', nik: decodedText });
            if(res.success) {
                if(res.data.status_memilih === 'Sudah Memilih') {
                    alert("Maaf, NIK ini SUDAH DIGUNAKAN.");
                    startScanner();
                } else {
                    currentUser = res.data;
                    document.getElementById('voterName').innerText = currentUser.nama;
                    document.getElementById('scanSection').classList.add('hidden');
                    document.getElementById('voteSection').classList.remove('hidden');
                }
            } else {
                alert("NIK tidak ditemukan!");
                startScanner();
            }
        });
    }

    async function fetchKandidat() {
        let res = await req({action: 'getKandidat'});
        if(res.success) {
            allKandidat = res.data;
            let html = '';
            allKandidat.slice(0, 4).forEach(k => {
                html += `
                <div class="card kandidat-card shadow-sm" id="card_${k.id}" onclick="toggleKandidat('${k.id}')">
                    <img src="${k.foto}" class="card-img-top kandidat-img" alt="${k.nama}">
                    <div class="card-body-compact">
                        <h6>${k.nama}</h6>
                    </div>
                </div>`;
            });
            document.getElementById('kandidatList').innerHTML = html;
        }
    }

    function toggleKandidat(id) {
        let el = document.getElementById('card_' + id);
        if(selectedKandidat.includes(id)) {
            selectedKandidat = selectedKandidat.filter(i => i !== id);
            el.classList.remove('selected');
        } else {
            selectedKandidat.push(id);
            el.classList.add('selected');
        }
    }

    function konfirmasiVote() {
        if(selectedKandidat.length === 0) {
            alert("Anda belum memilih kandidat!");
            return;
        }
        
        let confirmHtml = "";
        selectedKandidat.forEach(id => {
            // FIX: String matching untuk menghindari error TypeError undefined
            let k = allKandidat.find(x => String(x.id) === String(id));
            if(k) {
                confirmHtml += `
                <div class="mb-2 text-center">
                    <img src="${k.foto}" class="confirm-img shadow-sm">
                    <div class="fs-6 text-dark">${k.nama}</div>
                </div>`;
            }
        });

        if(selectedKandidat.length > 1) {
            confirmHtml += "<div class='text-danger bg-warning p-1 mt-1 rounded' style='font-size:0.75rem;'>⚠️ Lebih dari 1 kandidat. Suara <b>TIDAK SAH</b>.</div>";
        }

        document.getElementById('confirmKandidat').innerHTML = confirmHtml;
        confirmModal.show();
    }

    async function submitVote() {
        confirmModal.hide();
        document.getElementById('voteSection').classList.add('hidden');
        document.getElementById('scanSection').classList.remove('hidden');
        document.getElementById('reader').innerHTML = "<h5 class='text-success mt-3'>Menyimpan suara...</h5>";
        
        let valid = selectedKandidat.length === 1; 
        let pilihan_id = selectedKandidat.join(", "); 

        let data = {
            action: 'vote',
            row: currentUser.row,
            pilihan_id: pilihan_id,
            valid: valid
        };

        let res = await req(data);
        if(res.success) {
            alert("Berhasil! Terima kasih.");
            selectedKandidat = []; 
            startScanner(); 
        }
    }
</script>
</body>
</html>
