<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - E-Pilkades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .print-area { text-align: center; margin-top: 15px; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Panel Admin Pilkades</a>
        <a class="btn btn-warning btn-sm fw-bold" href="index.html">Ke Bilik Suara</a>
    </div>
</nav>

<div class="container mt-5">
    <h3 class="mb-4 text-center">Management Pemilih & Kandidat</h3>
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white fw-bold">Tambah Kandidat</div>
                <div class="card-body">
                    <p class="text-muted small">ID Kandidat akan dibuat otomatis oleh sistem.</p>
                    <input type="text" id="k_nama" class="form-control mb-3" placeholder="Nama Kandidat">
                    <input type="text" id="k_foto" class="form-control mb-4" placeholder="URL Foto (https://...)">
                    <button class="btn btn-primary w-100" onclick="tambahKandidat()">Simpan Kandidat</button>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-success text-white fw-bold">Tambah Pemilih & Cetak QR</div>
                <div class="card-body">
                    <p class="text-muted small">ID Pemilih akan dibuat otomatis oleh sistem.</p>
                    <input type="text" id="p_nama" class="form-control mb-3" placeholder="Nama Pemilih">
                    <input type="number" id="p_nik" class="form-control mb-4" placeholder="NIK Pemilih">
                    <button class="btn btn-success w-100 mb-3" onclick="tambahPemilih()">Simpan & Generate QR Code</button>
                    
                    <div id="qrResult" class="hidden print-area border p-3 rounded bg-white">
                        <p class="text-muted mb-2">Simpan atau cetak QR Code berikut untuk diserahkan ke pemilih.</p>
                        <img id="qrImage" src="" alt="QR Code" class="img-fluid mb-2" style="max-width: 250px;">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2JfCb7tsOJucFMUwa6evk2K2zD7p7boNLsdPNkclbQOa66ab1GeYMKBXhYC5s6hZJ/exec'; 

    async function req(data) {
        let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(data),
            headers: {'Content-Type': 'text/plain;charset=utf-8'}
        });
        return await res.json();
    }

    async function tambahKandidat() {
        let nama = document.getElementById('k_nama').value;
        let foto = document.getElementById('k_foto').value;
        
        if(!nama || !foto) { alert("Harap isi nama dan URL foto!"); return; }

        let btn = event.target; btn.disabled = true; btn.innerText = "Menyimpan...";
        let data = { action: 'addKandidat', nama: nama, foto: foto };
        let res = await req(data);
        if(res.success) {
            alert("Kandidat berhasil ditambahkan ke database!");
            document.getElementById('k_nama').value = '';
            document.getElementById('k_foto').value = '';
        }
        btn.disabled = false; btn.innerText = "Simpan Kandidat";
    }

    async function tambahPemilih() {
        let nama = document.getElementById('p_nama').value;
        let nik = document.getElementById('p_nik').value;

        if(!nama || !nik) { alert("Harap isi nama dan NIK!"); return; }

        let btn = event.target; btn.disabled = true; btn.innerText = "Menyimpan...";
        let data = { action: 'addPemilih', nama: nama, nik: nik };
        let res = await req(data);
        if(res.success) {
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${nik}`;
            document.getElementById('qrResult').classList.remove('hidden');
            document.getElementById('p_nama').value = '';
            document.getElementById('p_nik').value = '';
        }
        btn.disabled = false; btn.innerText = "Simpan & Generate QR Code";
    }
</script>
</body>
</html>
